name: CD
run-name: CD Staging [${{ github.ref_name }}]

on:
  push:
    branches:
      - develop

env:
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WITNESS_APP_LOCATION: src/Apps/Ui/NoTiming.Ui
  WITNESS_PUBLISH_PATH: NTS.Witness.Web/publish
  SOURCE_PATH: src/NoTiming
  ARTIFACT_PATH: NTS.Nexus.Warp/publish
  AZURE_RESOURCE: nts-nexus-warp-dev

jobs:
  unit-tests:
    uses: ./.github/workflows/nts-unit-tests.yaml

  deploy-message-bus:
    needs: unit-tests
    runs-on: ubuntu-latest
    name: Staging - MessageBus
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

    - name: Restore
      run: dotnet restore "${{ env.SOURCE_PATH }}"

    - name: Build
      run: |
        dotnet build ${{ env.SOURCE_PATH }} \
        --configuration ${{ env.CONFIGURATION }} \
        --no-restore

    - name: Publish
      run: |
        dotnet publish ${{ env.SOURCE_PATH }} \
        --configuration ${{ env.CONFIGURATION }} \
        --no-build \
        --output ${{ env.ARTIFACT_PATH }}

    - name: Publish Witness UI
      run: |
        dotnet publish ${{ env.WITNESS_APP_LOCATION }} \
        --configuration ${{ env.CONFIGURATION }} \
        --output ${{ env.WITNESS_PUBLISH_PATH }}

    - name: Add Witness UI to Warp package
      run: |
        mkdir -p "${{ env.ARTIFACT_PATH }}/wwwroot"
        cp -r "${{ env.WITNESS_PUBLISH_PATH }}/wwwroot/." "${{ env.ARTIFACT_PATH }}/wwwroot/"

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_RESOURCE }}
        publish-profile: ${{ secrets.AZURE_NTS_NEXUS_WARP_DEV_PUBLISH_PROFILE }}
        package: ${{ env.ARTIFACT_PATH }}
