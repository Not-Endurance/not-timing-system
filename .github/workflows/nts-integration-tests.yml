name: "Integration Tests"

on:
  workflow_dispatch:

env:
  CONFIGURATION: Release
  TEST_PROJECT_PATH: tests/NTS.Tests.Integration/NTS.Tests.Integration.csproj
  DOTNET_CLI_HOME: ${{ github.workspace }}/.tmp/dotnet-home
  NUGET_PACKAGES: ${{ github.workspace }}/.tmp/nuget-packages

jobs:
  integration-tests:
    name: NTS Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The tests host the Api in their own process on a MongoDB in a container (Docker is on the runner), so .NET 10
      # is all they need.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} -c ${{ env.CONFIGURATION }} --no-restore

      # The passkey ceremonies (#600) drive a real Chromium with a virtual authenticator. The test project's build puts the
      # installer of its own Playwright version next to the tests, so the browser matches the library.
      - name: Install Chromium for Playwright
        shell: pwsh
        run: ./tests/NTS.Tests.Integration/bin/${{ env.CONFIGURATION }}/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} -c ${{ env.CONFIGURATION }} --no-build
