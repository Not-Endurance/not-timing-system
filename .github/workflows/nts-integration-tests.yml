name: "[net10] Integration Tests"

on:
  workflow_dispatch:

env:
  DOTNET_CORE_VERSION: 10.0.x
  CONFIGURATION: Release
  TEST_PROJECT_PATH: tests/NoTiming.IntegrationTests/NoTiming.IntegrationTests.csproj
  DOTNET_CLI_HOME: ${{ github.workspace }}/.tmp/dotnet-home
  NUGET_PACKAGES: ${{ github.workspace }}/.tmp/nuget-packages

jobs:
  integration-tests:
    name: NTS Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.TEST_PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.TEST_PROJECT_PATH }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} -c ${{ env.CONFIGURATION }} --no-build
