name: CD
run-name: CD Production [${{ github.ref_name }}]

on:
  push:
    branches:
      - master

env:
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  APP_LOCATION: src/Apps/Witness/NTS.Witness.Web
  API_LOCATION: src/Apps/Nexus/NTS.Nexus.HTTP
  API_ARTIFACT_NAME: nts-nexus-http-api
  API_ARTIFACT_PATH: NTS.Nexus.HTTP/publish
  OUTPUT_LOCATION: wwwroot
  SOURCE_PATH: src/Apps/Nexus/NTS.Nexus.Warp
  ARTIFACT_PATH: NTS.Nexus.Warp/publish
  AZURE_RESOURCE: nts-warp-prod

jobs:
  build-api:
    runs-on: windows-latest
    name: Production - Nexus HTTP API
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.API_LOCATION }}"

      - name: Build
        run: dotnet build "${{ env.API_LOCATION }}" --configuration "${{ env.CONFIGURATION }}" --no-restore

      - name: Publish
        run: dotnet publish "${{ env.API_LOCATION }}" --configuration "${{ env.CONFIGURATION }}" --no-build --output "${{ env.API_ARTIFACT_PATH }}" /p:UseAppHost=false /p:PlaywrightPlatform=win

      - name: Install Playwright Chromium
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: pwsh "${{ env.API_ARTIFACT_PATH }}/playwright.ps1" install --only-shell chromium

      - name: Verify Playwright browser payload
        shell: pwsh
        run: |
          $browserRoot = Join-Path "${{ env.API_ARTIFACT_PATH }}" ".playwright/package/.local-browsers"

          if (-not (Test-Path -LiteralPath $browserRoot)) {
            throw "Playwright browser payload was not installed under '$browserRoot'."
          }

          $browser = Get-ChildItem -LiteralPath $browserRoot -Recurse -File |
            Where-Object { $_.Name -in @("chrome-headless-shell.exe", "chrome.exe") } |
            Select-Object -First 1

          if ($null -eq $browser) {
            throw "Playwright Chromium executable was not found under '$browserRoot'."
          }

          Write-Host "Found Playwright browser: $($browser.FullName)"

      - name: Upload Nexus HTTP API artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.API_ARTIFACT_NAME }}
          path: ${{ env.API_ARTIFACT_PATH }}
          include-hidden-files: true

  deploy-message-bus:
    runs-on: ubuntu-latest
    name: Production - MessageBus
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}  # adjust if needed

    - name: Restore
      run: dotnet restore "${{ env.SOURCE_PATH }}"

    - name: Build
      run: |
        dotnet build ${{ env.SOURCE_PATH }} \
        --configuration ${{ env.CONFIGURATION }} \
        --no-restore

    - name: Publish
      run: |
        dotnet publish ${{ env.SOURCE_PATH }} \
        --configuration ${{ env.CONFIGURATION }} \
        --no-build \
        --output ${{ env.ARTIFACT_PATH }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_RESOURCE }}
        publish-profile: ${{ secrets.AZURE_NTS_NEXUS_WARP_PRODUCTION_PUBLISH_PROFILE }}
        package: ${{ env.ARTIFACT_PATH }}

  deploy-client:
    needs: [build-api, deploy-message-bus]
    runs-on: ubuntu-latest
    name: Production - Client
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Configure Witness Environment
        shell: pwsh
        env:
          WITNESS_ENVIRONMENT: Production
        run: |
          $configPath = Join-Path $env:GITHUB_WORKSPACE "${{ env.APP_LOCATION }}/wwwroot/staticwebapp.config.json"
          $config = Get-Content -Raw -Path $configPath | ConvertFrom-Json

          if ($null -eq $config.globalHeaders) {
            $config | Add-Member -MemberType NoteProperty -Name globalHeaders -Value ([pscustomobject]@{})
          }

          $config.globalHeaders | Add-Member -MemberType NoteProperty -Name "Blazor-Environment" -Value $env:WITNESS_ENVIRONMENT -Force
          $config | ConvertTo-Json -Depth 10 | Set-Content -Path $configPath

      - name: Download Nexus HTTP API artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.API_ARTIFACT_NAME }}
          path: ${{ env.API_ARTIFACT_PATH }}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "upload"
          production_branch: master
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_ISLAND_0DC61C703 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          app_location: ${{ env.APP_LOCATION }}
          api_location: ${{ env.API_ARTIFACT_PATH }}
          output_location: ${{ env.OUTPUT_LOCATION }}
          skip_api_build: true
