name: CD
run-name: CD Production [${{ github.ref_name }}]

on:
  push:
    branches:
      - master

env:
  CONFIGURATION: Release
  # The hosts are .NET 10. .NET 10 bakes the Blazor environment into the Ui at build time and no longer reads the
  # Blazor-Environment response header, so every build of the Ui names its environment.
  DOTNET_HOST_VERSION: 10.0.x
  WASM_ENVIRONMENT: Production
  API_PROJECT: src/NoTiming.Api/NoTiming.Api.csproj
  API_ARTIFACT_PATH: NoTiming.Api/publish
  AZURE_RESOURCE: nts-warp-prod
  UI_PROJECT: src/NoTiming.Ui/NoTiming.Ui.csproj
  UI_ARTIFACT_PATH: NoTiming.Ui/publish
  # The legacy Functions API still deploys with the static web app until it is retired (#647). Static Web Apps builds
  # it from source; the Ui is built here and uploaded as it is.
  FUNCTIONS_API_LOCATION: src/Apps/Nexus/NTS.Nexus.HTTP

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    name: Production - Api
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_HOST_VERSION }}

    - name: Restore
      run: dotnet restore "${{ env.API_PROJECT }}"

    - name: Publish
      run: |
        dotnet publish ${{ env.API_PROJECT }} \
        --configuration ${{ env.CONFIGURATION }} \
        --no-restore \
        -p:WasmApplicationEnvironmentName=${{ env.WASM_ENVIRONMENT }} \
        --output ${{ env.API_ARTIFACT_PATH }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_RESOURCE }}
        publish-profile: ${{ secrets.AZURE_NTS_NEXUS_WARP_PRODUCTION_PUBLISH_PROFILE }}
        package: ${{ env.API_ARTIFACT_PATH }}

  deploy-client:
    needs: deploy-api
    runs-on: ubuntu-latest
    name: Production - Client
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          lfs: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_HOST_VERSION }}

      - name: Publish Ui
        run: |
          dotnet publish ${{ env.UI_PROJECT }} \
          --configuration ${{ env.CONFIGURATION }} \
          -p:WasmApplicationEnvironmentName=${{ env.WASM_ENVIRONMENT }} \
          --output ${{ env.UI_ARTIFACT_PATH }}

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "upload"
          production_branch: master
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_ISLAND_0DC61C703 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          skip_app_build: true
          app_location: ${{ env.UI_ARTIFACT_PATH }}/wwwroot
          api_location: ${{ env.FUNCTIONS_API_LOCATION }}
