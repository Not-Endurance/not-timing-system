name: CR
run-name: CR [${{ github.ref_name }}]

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# One CR run per pull request: a new push cancels the run still going for the commit it replaces.
concurrency:
  group: cr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Every project is .NET 10 and builds with the .NET 10 SDK. Csharpier 0.30.6 runs on .NET 8, so that job installs it.
  DOTNET_CORE_VERSION: 8.0.x
  DOTNET_HOST_VERSION: 10.0.x
  SOURCE_DIR: src
  CONFIGURATION: Release
  SOLUTION_FILE: not-timing-system.sln

jobs:
  pr-checks-csharpier:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    name: Csharpier format
    steps:
      - name: Print pull_request event
        run: |
          echo Branch:
          echo "${{ github.event.pull_request }}"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Use custom PAT instead of GITHUB_TOKEN in order to allow subsequent workflow execution 
          # based on this csharpier commit. Otherwise the PR is stuc (csharpier commit is never checked):
          # https://stackoverflow.com/questions/74047352/github-checks-reset-their-statuses-after-push-made-by-a-workflow-run
          token: ${{ secrets.NTS_CICD_PAT }}  
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}  #

      - name: Install Csharpier
        run: dotnet tool install -g csharpier --version 0.30.6

      - name: Format code
        run: dotnet csharpier .

      - name: Check for formatting changes
        run: |
          if [[ `git status --porcelain` ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if [[ `git status --porcelain` ]]; then
              git commit -m "Apply Csharpier code formatting"
              git push
            else 
              echo "No formatting changes needed"
            fi
          else
            echo "No formatting changes needed"
          fi

  pr-checks-build:
    runs-on: ubuntu-latest
    needs: pr-checks-csharpier
    name: Dotnet build
    steps:
    - uses: actions/checkout@v6
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_HOST_VERSION }}

    - name: Restore
      run: dotnet restore ${{ env.SOURCE_DIR }}/${{ env.SOLUTION_FILE }}

    - name: Build
      run: dotnet build ${{ env.SOURCE_DIR }}/${{ env.SOLUTION_FILE }} -c ${{ env.CONFIGURATION }} --no-restore

    # The unit tests, which include the architecture of ADR-0011 read from the project files: no Docker and no browser, a few seconds on the build above.
    - name: Unit tests
      run: dotnet test tests/NTS.Tests.Unit/NTS.Tests.Unit.csproj -c ${{ env.CONFIGURATION }} --no-build

    # The shared library of the tests (ADR-0016): generic, no Docker and no browser.
    - name: Shared test library tests
      run: dotnet test nugets/Not.Test.Tests/Not.Test.Tests.csproj -c ${{ env.CONFIGURATION }} --no-build

    # The integration tests (ADR-0016) need Docker and a browser, both on the runner. They run only for pull requests into master.
    # Docker Hub rate-limits anonymous pulls, so the MongoDB image is pulled first, with retries.
    - name: Pull the MongoDB image
      if: github.base_ref == 'master'
      run: |
        for attempt in 1 2 3; do
          if docker pull mongo:6.0; then exit 0; fi
          sleep 30
        done
        exit 1

    - name: Install Chromium for Playwright
      if: github.base_ref == 'master'
      shell: pwsh
      run: ./tests/NTS.Tests.Integration/bin/${{ env.CONFIGURATION }}/net10.0/playwright.ps1 install --with-deps chromium

    # Ryuk, the Testcontainers reaper, is off: the runner is discarded after the job, and its image comes from Docker Hub.
    - name: Integration tests
      if: github.base_ref == 'master'
      timeout-minutes: 60
      env:
        TESTCONTAINERS_RYUK_DISABLED: "true"
      run: dotnet test tests/NTS.Tests.Integration/NTS.Tests.Integration.csproj -c ${{ env.CONFIGURATION }} --no-build
